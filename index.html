<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Shell Trainer</title>
    <meta name="description" content="Linux-Befehle interaktiv üben – offline, direkt auf dem Handy." />
    <meta name="theme-color" content="#14161b" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <button class="icon-btn" id="back-btn" aria-label="Zurück" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <h1 id="title">Shell Trainer</h1>
      <span class="topbar-extra" id="topbar-extra"></span>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="learn" class="active"><span aria-hidden="true">🎓</span>Lernen</button>
      <button data-tab="training"><span aria-hidden="true">⚡</span>Training</button>
      <button data-tab="vocab"><span aria-hidden="true">🧠</span>Vokabeln</button>
      <button data-tab="reference"><span aria-hidden="true">📖</span>Spickzettel</button>
    </nav>

    <script src="js/shell.js"></script>
    <script src="js/lessons.js"></script>
    <script src="js/drills.js"></script>
    <script src="js/vocab.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
